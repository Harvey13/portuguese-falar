[build]
  command = "bun run build && printf '{\"type\":\"module\"}\\n' > dist/server/package.json"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  BUN_VERSION = "1.3.14"

[functions]
  included_files = [
    "dist/server/**",
    "node_modules/h3-v2/**",
    "node_modules/rou3/**",
    "node_modules/srvx/**",
  ]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true
